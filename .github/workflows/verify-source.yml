name: Speed test ModelScope
on:
  push:
    paths: ['VERIFY_REQ']
jobs:
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: dl speed from modelscope
        run: |
          curl -sL --max-time 30 -o /dev/null -w "runner->ModelScope: %{speed_download} B/s (%{size_download} bytes)\n" "https://modelscope.cn/models/ZhipuAI/GLM-5.3/resolve/master/model-00001-of-00141.safetensors"
          curl -sL --max-time 30 -o /dev/null -w "runner->ModelScope again: %{speed_download} B/s\n" "https://modelscope.cn/models/ZhipuAI/GLM-5.3/resolve/master/model-00010-of-00141.safetensors"
