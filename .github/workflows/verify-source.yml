name: Probe daily packs 2023-03
on:
  push:
    paths: ['VERIFY_REQ']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: check daily URLs
        run: |
          for D in 13 14 15 20 31; do
            URL="https://data.binance.vision/data/spot/daily/trades/BTCUSDT/BTCUSDT-trades-2023-03-$D.zip"
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -I --max-time 20 "$URL")
            echo "2023-03-$D: HTTP $CODE"
          done
