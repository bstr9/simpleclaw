name: Proxy

on:
  push:
    paths:
      - 'TRIGGER'

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse request
        id: parse
        run: |
          MSG="$(git log -1 --pretty=%B | tr -d '\r' | head -1)"
          echo "CMD=$(echo "$MSG" | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "URL=$(echo "$MSG" | cut -d' ' -f2-)" >> $GITHUB_OUTPUT

      - name: Download file
        if: steps.parse.outputs.CMD == 'dlrel'
        run: |
          URL="${{ steps.parse.outputs.URL }}"
          wget -q -T 300 --tries=3 "$URL" -O /tmp/payload.bin
          echo "size: $(stat -c%s /tmp/payload.bin)"
          sha256sum /tmp/payload.bin

      - name: Ensure release
        if: steps.parse.outputs.CMD == 'dlrel'
        run: |
          gh release view dlpipe --repo ${{ github.repository }} >/dev/null 2>&1 || \
            gh release create dlpipe --repo ${{ github.repository }} -t "pipeline" -n "auto"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload to release
        if: steps.parse.outputs.CMD == 'dlrel'
        run: |
          gh release upload dlpipe /tmp/payload.bin --repo ${{ github.repository }} --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload artifact
        if: steps.parse.outputs.CMD == 'dlart'
        uses: actions/upload-artifact@v4
        with:
          name: payload
          path: /tmp/payload.bin
          retention-days: 1

      - name: Text request
        if: steps.parse.outputs.CMD == 'px'
        run: |
          URL="${{ steps.parse.outputs.URL }}"
          curl -sS -m 60 "$URL"
