name: Proxy Test
on:
  push:
    paths:
      - 'TRIGGER'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test network
        run: |
          echo "=== Testing Google ==="
          curl -sS -m 10 -o /tmp/out -w "HTTP %{http_code} size %{size_download}" "https://www.google.com"
          echo ""
          head -c 200 /tmp/out || true
          echo ""
          echo "=== Testing GitHub ==="
          curl -sS -m 10 -o /dev/null -w "HTTP %{http_code}" "https://github.com"
          echo ""
          echo "=== Exit IP ==="
          curl -sS -m 5 http://ip-api.com/json
          echo ""
          echo "=== Done ==="
