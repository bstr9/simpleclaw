name: Proxy

on:
  push:
    paths:
      - 'TRIGGER'

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute request
        run: |
          MSG=$(git log -1 --pretty=%B)
          CMD=$(echo "$MSG" | awk '{print $1}')
          URL_B64=$(echo "$MSG" | awk '{print $2}')
          METHOD_B64=$(echo "$MSG" | awk '{print $3}')
          BODY_B64=$(echo "$MSG" | awk '{print $4}')
          URL=$(echo "$URL_B64" | base64 -d 2>/dev/null | tr -d "\r\n\000" || echo "")
          METHOD=$(echo "$METHOD_B64" | base64 -d 2>/dev/null || echo "GET")
          BODY=$(echo "$BODY_B64" | base64 -d 2>/dev/null || echo "")

          if [ "$CMD" = "pxb64:" ]; then
            echo "=== B64_RESULT_START ==="
            wget -q -T 90 -O /tmp/dl.bin "$URL"; echo "WGET_EXIT: $?"
            base64 -w 76 /tmp/dl.bin
            echo ""
            echo "=== B64_RESULT_END ==="
          else
            echo "=== PROXY_RESULT_START ==="
            if [ -n "$BODY" ]; then
              curl -sS -m 30 -X "$METHOD" \
                -H "Content-Type: application/json" \
                -d "$BODY" \
                -w "\n=== HTTP_STATUS: %{http_code} ===" \
                "$URL" 2>&1 || echo "CURL_ERROR"
            else
              curl -sS -m 30 -X "$METHOD" \
                -w "\n=== HTTP_STATUS: %{http_code} ===" \
                "$URL" 2>&1 || echo "CURL_ERROR"
            fi
            echo ""
            echo "=== PROXY_RESULT_END ==="
          fi
