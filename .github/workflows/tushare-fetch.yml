name: Tushare Data Fetcher

on:
  workflow_dispatch:
    inputs:
      api_name:
        description: 'Tushare API name'
        required: true
        default: 'trade_cal'
      params_json:
        description: 'API params JSON'
        required: false
        default: '{}'
  push:
    paths:
      - 'TUSHARE_REQ'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse request from commit message
        id: parse
        run: |
          MSG="$(git log -1 --pretty=%B | tr -d '\r' | head -1)"
          echo "API=$(echo "$MSG" | cut -d' ' -f2)" >> $GITHUB_OUTPUT
          echo "PARAMS=$(echo "$MSG" | cut -d' ' -f3-)" >> $GITHUB_OUTPUT

      - name: Fetch from Tushare
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request

          api_name = "${{ steps.parse.outputs.API }}" or "trade_cal"
          params_raw = "${{ steps.parse.outputs.PARAMS }}" or "{}"
          try:
              params = json.loads(params_raw)
          except Exception:
              params = {}
          token = os.environ.get("TUSHARE_TOKEN", "")

          payload = {"api_name": api_name, "token": token, "params": params, "fields": ""}

          result = None
          for endpoint in ["http://api.tushare.pro", "http://api.waditu.com"]:
              try:
                  req = urllib.request.Request(endpoint, data=json.dumps(payload).encode(),
                      headers={"Content-Type": "application/json"})
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      result = json.loads(resp.read().decode())
                      print(f"Endpoint: {endpoint} -> HTTP {resp.status}")
                      break
              except Exception as e:
                  print(f"{endpoint} failed: {e}")

          print("=" * 50)
          print("RESULT_JSON_BEGIN")
          print(json.dumps(result, ensure_ascii=False, indent=2) if result else "ALL FAILED")
          print("RESULT_JSON_END")
          PYEOF
