name: Crypto Data Probe 2

on:
  push:
    paths:
      - 'CRYPTO_REQ2'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Try OKX/Bybit/Kraken/Coinbase/Bitstamp (US runner is restricted for Binance)
        run: |
          echo "=== OKX 1s candles? (OKX min is 1m) probe history ==="
          curl -s --max-time 10 "https://www.okx.com/api/v5/market/candles?instId=BTC-USDT&bar=1m&limit=3" | head -c 300
          echo; echo
          echo "=== OKX history candles (up to 2017) ==="
          curl -s --max-time 10 "https://www.okx.com/api/v5/market/history-candles?instId=BTC-USDT&bar=1m&after=1500000000000&limit=3" | head -c 300
          echo; echo
          echo "=== Kraken OHLC (720min max interval, but trades endpoint) ==="
          curl -s --max-time 10 "https://api.kraken.com/0/public/Trades?pair=XBTUSD&since=1500000000" | head -c 300
          echo; echo
          echo "=== Bitstamp BTCUSD 1m (earliest ~2011) ==="
          curl -s --max-time 10 "https://www.bitstamp.net/api/v2/ohlc/btcusd/?step=60&limit=3&start=1313000000" | head -c 400
          echo; echo
          echo "=== Coinbase 1m candles (earliest ~2014) ==="
          curl -s --max-time 10 "https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=60&start=2017-08-01" | head -c 300
          echo; echo
          echo "=== Bybit 1s? min interval 1m ==="
          curl -s --max-time 10 "https://api.bybit.com/v5/market/kline?category=spot&symbol=BTCUSDT&interval=1&limit=3" | head -c 300
          echo; echo
          echo "=== Binance Vision direct file download (no geo restriction?) ==="
          curl -sI --max-time 15 "https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1m/BTCUSDT-1m-2017-08.zip" | head -5
