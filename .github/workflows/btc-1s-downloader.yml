name: BTC 1s OHLCV Downloader

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Year (e.g. 2017)'
        required: true
      months:
        description: 'Comma-separated months (e.g. 08,09,10)'
        required: true
  push:
    paths:
      - 'BTC_BATCH'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}
          fetch-depth: 1

      - name: Parse params (push trigger)
        if: github.event_name == 'push'
        run: |
          MSG="$(git log -1 --pretty=%B | tr -d '\r' | head -1)"
          # format: btc1s <year> <months>
          echo "YEAR=$(echo "$MSG" | awk '{print $2}')" >> $GITHUB_ENV
          echo "MONTHS=$(echo "$MSG" | awk '{print $3}')" >> $GITHUB_ENV

      - name: Set params (dispatch trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "YEAR=${{ inputs.year }}" >> $GITHUB_ENV
          echo "MONTHS=${{ inputs.months }}" >> $GITHUB_ENV

      - name: Install tools
        run: pip install -q polars pyarrow

      - name: Download and convert trades to 1s OHLCV
        run: |
          mkdir -p "$GITHUB_WORKSPACE/btc_1s"
          echo "YEAR=$YEAR, MONTHS=$MONTHS"
          IFS=',' read -ra MONTH_ARR <<< "$MONTHS"
          for MONTH in "${MONTH_ARR[@]}"; do
            M="$MONTH"
            FILE="BTCUSDT-trades-${YEAR}-${M}.zip"
            URL="https://data.binance.vision/data/spot/monthly/trades/BTCUSDT/${FILE}"
            echo "=== Downloading $FILE ==="
            curl -s --max-time 300 --retry 3 -o "/tmp/${FILE}" "$URL"
            SIZE=$(stat -c%s "/tmp/${FILE}" 2>/dev/null || echo 0)
            echo "size: $SIZE bytes"
            if [ "$SIZE" -lt 1000 ]; then
              echo "SKIP: file too small or missing"
              continue
            fi
            cd /tmp && unzip -q -o "$FILE"
            CSV="BTCUSDT-trades-${YEAR}-${M}.csv"
            ls -la "$CSV"
            OUT_NAME="btcusdt_1s_${YEAR}-${M}.parquet"
            python3 "$GITHUB_WORKSPACE/convert.py" "$CSV" "/tmp/${OUT_NAME}"
            cp "/tmp/${OUT_NAME}" "$GITHUB_WORKSPACE/btc_1s/"
            rm -f "/tmp/${FILE}" "/tmp/${CSV}" "/tmp/${OUT_NAME}"
            cd "$GITHUB_WORKSPACE"
          done
          ls -la "$GITHUB_WORKSPACE/btc_1s/"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: btc-1s-${{ env.YEAR }}-${{ env.MONTHS }}
          path: btc_1s/*.parquet
          retention-days: 1
          compression-level: 0

      - name: Write result marker
        run: |
          echo "done_${YEAR}_${MONTHS}=$(date +%s)" > BTC_BATCH_DONE
          git config user.name "data-bot"
          git config user.email "bot@actions.local"
          git add "$GITHUB_WORKSPACE/btc_1s/" BTC_BATCH_DONE
          git commit -q -m "results ${YEAR}-${MONTHS}" || echo "nothing"
          git push -q origin main || (git pull -q --rebase origin main && git push -q origin main)
          echo "DONE - results committed to repo btc_1s/"
